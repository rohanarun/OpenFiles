<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>note.otxt.html</title>
  <style>
    :root {
      --bg: #f4efe4;
      --panel: #fffaf0;
      --ink: #1c1917;
      --accent: #c2410c;
      --accent-soft: #ffedd5;
      --line: #d6d3d1;
      --muted: #57534e;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at top left, rgba(255, 237, 213, 0.95), transparent 28rem),
        linear-gradient(180deg, #fef3c7 0%, var(--bg) 55%);
      color: var(--ink);
      font: 16px/1.5 "Avenir Next", "Segoe UI", sans-serif;
    }

    .app {
      width: min(1100px, calc(100vw - 2rem));
      margin: 1rem auto;
      padding: 1rem;
      border: 1px solid rgba(194, 65, 12, 0.18);
      border-radius: 24px;
      background: rgba(255, 250, 240, 0.9);
      backdrop-filter: blur(12px);
      box-shadow: 0 20px 60px rgba(120, 53, 15, 0.12);
    }

    header {
      display: grid;
      gap: 0.75rem;
      margin-bottom: 1rem;
    }

    .eyebrow {
      display: inline-flex;
      width: fit-content;
      padding: 0.35rem 0.7rem;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent);
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 4vw, 3.5rem);
      line-height: 0.95;
    }

    p {
      margin: 0;
      color: var(--muted);
      max-width: 60ch;
    }

    .controls,
    .footer {
      display: grid;
      gap: 0.8rem;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      margin-bottom: 1rem;
    }

    label {
      display: grid;
      gap: 0.35rem;
      font-size: 0.95rem;
      font-weight: 600;
    }

    input,
    textarea,
    button {
      font: inherit;
    }

    input,
    textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 0.9rem 1rem;
      background: #fffcf7;
      color: var(--ink);
    }

    textarea {
      min-height: 55vh;
      resize: vertical;
      font: 16px/1.65 "SF Mono", "Menlo", monospace;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      align-items: end;
    }

    button {
      border: 0;
      border-radius: 999px;
      padding: 0.8rem 1.2rem;
      cursor: pointer;
      transition: transform 140ms ease, box-shadow 140ms ease;
    }

    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 10px 22px rgba(28, 25, 23, 0.14);
    }

    .primary {
      background: var(--accent);
      color: #fff7ed;
      font-weight: 700;
    }

    .secondary {
      background: #ffffff;
      color: var(--ink);
      border: 1px solid rgba(214, 211, 209, 0.9);
    }

    .stat {
      padding: 0.9rem 1rem;
      border: 1px solid rgba(214, 211, 209, 0.9);
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.66);
    }

    .stat strong {
      display: block;
      font-size: 1.3rem;
    }

    .notice {
      min-height: 1.4rem;
      color: var(--accent);
      font-weight: 600;
    }

    @media (max-width: 700px) {
      .app {
        width: calc(100vw - 1rem);
        padding: 0.85rem;
      }

      textarea {
        min-height: 48vh;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <span class="eyebrow">Portable Text File</span>
      <h1>Hello World Note</h1>
      <p>
        This <code>.otxt.html</code> file is both the document and the editor. Edit the note, then save a fresh
        self-contained copy that carries the same software forward.
      </p>
    </header>

    <section class="controls">
      <label>
        Export file name
        <input id="fileName" type="text" value="note.otxt.html">
      </label>
      <label>
        Note title
        <input id="title" type="text" value="Hello World Note">
      </label>
    </section>

    <label>
      Note body
      <textarea id="body"></textarea>
    </label>

    <section class="footer">
      <div class="actions">
        <button id="saveSelfContained" class="primary">Save Self-Contained Copy</button>
        <button id="downloadText" class="secondary">Download Plain Text</button>
      </div>
      <div class="stat">
        <span>Characters</span>
        <strong id="charCount">0</strong>
      </div>
      <div class="stat">
        <span>Words</span>
        <strong id="wordCount">0</strong>
      </div>
    </section>

    <div id="notice" class="notice" aria-live="polite"></div>
  </div>

  <script id="embedded-state" type="application/json">
{
  "fileName": "note.otxt.html",
  "title": "Hello World Note",
  "body": "Hello world.\\n\\nThis file carries its own software. Edit this note, click Save Self-Contained Copy, and the downloaded HTML file will open with the same editor built in.\\n\\nThat means each new note can create the next note without installing anything extra beyond a browser."
}
  </script>
  <script>
    (() => {
      const stateNode = document.getElementById("embedded-state");
      const state = JSON.parse(stateNode.textContent);
      const fileNameInput = document.getElementById("fileName");
      const titleInput = document.getElementById("title");
      const bodyInput = document.getElementById("body");
      const charCount = document.getElementById("charCount");
      const wordCount = document.getElementById("wordCount");
      const notice = document.getElementById("notice");

      function loadState() {
        fileNameInput.value = state.fileName;
        titleInput.value = state.title;
        bodyInput.value = state.body;
        document.title = state.fileName;
        document.querySelector("h1").textContent = state.title;
        updateStats();
      }

      function captureState() {
        return {
          fileName: (fileNameInput.value || "note.otxt.html").trim(),
          title: (titleInput.value || "Untitled Note").trim(),
          body: bodyInput.value
        };
      }

      function updateStats() {
        const text = bodyInput.value;
        const words = text.trim() ? text.trim().split(/\s+/).length : 0;
        charCount.textContent = String(text.length);
        wordCount.textContent = String(words);
        document.querySelector("h1").textContent = titleInput.value || "Untitled Note";
      }

      function downloadFile(name, text, type) {
        const blob = new Blob([text], { type });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = name;
        link.click();
        setTimeout(() => URL.revokeObjectURL(url), 5000);
      }

      function saveSelfContained() {
        const nextState = captureState();
        const clone = document.documentElement.cloneNode(true);
        clone.querySelector("#embedded-state").textContent = JSON.stringify(nextState, null, 2);
        const serialized = "<!DOCTYPE html>\n" + clone.outerHTML;
        downloadFile(nextState.fileName, serialized, "text/html");
        notice.textContent = "Saved a new self-contained note.";
      }

      function downloadPlainText() {
        const nextState = captureState();
        const plainName = nextState.fileName.replace(/\.html?$/i, ".txt");
        downloadFile(plainName, nextState.body, "text/plain");
        notice.textContent = "Downloaded the plain-text version.";
      }

      document.getElementById("saveSelfContained").addEventListener("click", saveSelfContained);
      document.getElementById("downloadText").addEventListener("click", downloadPlainText);
      bodyInput.addEventListener("input", updateStats);
      titleInput.addEventListener("input", updateStats);
      loadState();
    })();
  </script>
</body>
</html>
